name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release (vX.Y.Z)
        required: true
        type: string

# Every job opts into the exact permissions it needs.
permissions: {}

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the tagged source
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must match vX.Y.Z exactly (received: ${tag})"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify tag and source versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          node scripts/set-version.mjs --check "${RELEASE_VERSION}"

  build:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Signing secrets live only in this environment, which accepts runs from
    # vX.Y.Z tags (and main, for manual re-runs of an existing tag).
    environment: release
    permissions:
      contents: read # check out the tagged source
      id-token: write # sign build provenance attestations and log in to Azure with OIDC
      attestations: write # store the build provenance attestations
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            asset_name: GoJS-macOS-arm64
            runner: macos-26
            rust_target: aarch64-apple-darwin
            node_platform: darwin
            node_arch: arm64
          # Cross-compiled on Apple Silicon: the Intel runners take twice as
          # long and are being retired.
          - label: macOS Intel
            asset_name: GoJS-macOS-x64
            runner: macos-26
            rust_target: x86_64-apple-darwin
            node_platform: darwin
            node_arch: x64
          - label: Windows x64
            asset_name: GoJS-Windows-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            node_platform: win32
            node_arch: x64
          # The oldest supported Ubuntu keeps the AppImage and .deb compatible
          # with older glibc versions.
          - label: Linux x64
            asset_name: GoJS-Linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            node_platform: linux
            node_arch: x64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      # No caches anywhere in this workflow: a poisoned cache entry would end
      # up inside signed release binaries.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.5.1
          package-manager-cache: false

      - name: Install Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install stable --profile minimal --target "${RUST_TARGET}" --no-self-update
          rustup default stable

      - name: Install Linux system dependencies
        if: matrix.node_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm version:check "${RELEASE_VERSION}"

      - name: Fetch target Node.js runtime
        env:
          NODE_ARCH: ${{ matrix.node_arch }}
          NODE_PLATFORM: ${{ matrix.node_platform }}
        run: pnpm node:fetch

      # Compile before any signing credential exists in the job, so build
      # scripts of npm packages and crates never see them.
      - name: Compile desktop app
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: pnpm tauri build --ci --no-bundle --target "${RUST_TARGET}" -- --locked

      - name: Configure optional Apple signing
        if: matrix.node_platform == 'darwin'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_VAR: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_SIGNING_IDENTITY_VAR}" ]]; then
            # Apple Silicon refuses downloaded apps with no signature at all, so
            # sign ad-hoc: users can still allow it in Privacy & Security.
            echo "Apple signing is not configured; producing ad-hoc signed artifacts."
            echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/gojs-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          # -x: the private key can be used by codesign but never exported again.
          security import "${certificate_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -x
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          rm -f "${certificate_path}"

          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY_VAR}" >> "${GITHUB_ENV}"
          echo "GOJS_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          echo "GOJS_APPLE_SIGNING_READY=true" >> "${GITHUB_ENV}"

      # An App Store Connect API key, not an Apple ID: an app-specific password
      # would also unlock the account's iCloud data if it ever leaked.
      - name: Configure optional Apple notarization
        if: matrix.node_platform == 'darwin'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER }}
        run: |
          if [[ "${GOJS_APPLE_SIGNING_READY:-}" != "true" || -z "${APPLE_API_PRIVATE_KEY}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER_ID}" ]]; then
            echo "Apple notarization is not configured; skipping notarization."
            exit 0
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          (umask 077 && printf '%s\n' "${APPLE_API_PRIVATE_KEY}" > "${key_path}")

          echo "APPLE_API_KEY=${APPLE_API_KEY_ID}" >> "${GITHUB_ENV}"
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER_ID}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      # Federated OIDC login: there is no Azure secret to leak, and the token
      # only works for runs in the release environment.
      - name: Log in to Azure for Windows signing
        if: matrix.node_platform == 'win32' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Configure optional Windows signing
        if: matrix.node_platform == 'win32' && vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          ARTIFACT_SIGNING_CLIENT_VERSION: 1.0.128
          ARTIFACT_SIGNING_CLIENT_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $required = @(
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          if ($missing.Count -gt 0) {
            throw "AZURE_CLIENT_ID is set, but the Artifact Signing endpoint, account or profile is missing."
          }

          # The signtool dlib from Microsoft.ArtifactSigning.Client, pinned and verified.
          $version = $env:ARTIFACT_SIGNING_CLIENT_VERSION
          $package = Join-Path $env:RUNNER_TEMP "artifact-signing-client.zip"
          $clientDir = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          Invoke-WebRequest `
            -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" `
            -OutFile $package
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:ARTIFACT_SIGNING_CLIENT_SHA256) {
            throw "Checksum mismatch for Microsoft.ArtifactSigning.Client $version ($hash)."
          }
          Expand-Archive -Force -Path $package -DestinationPath $clientDir

          # Authenticate only through the Azure CLI session from the OIDC login.
          $metadataPath = Join-Path $env:RUNNER_TEMP "artifact-signing.json"
          @{
            Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_PROFILE
            ExcludeCredentials = @(
              "EnvironmentCredential",
              "ManagedIdentityCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Out-File -FilePath $metadataPath -Encoding utf8

          "GOJS_ARTIFACT_SIGNING_DLIB=$(Join-Path $clientDir 'bin\x64\Azure.CodeSigning.Dlib.dll')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOJS_ARTIFACT_SIGNING_METADATA=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bundle, sign and notarize
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: pnpm tauri bundle --ci --target "${RUST_TARGET}"

      - name: Notarize macOS disk image
        if: matrix.node_platform == 'darwin' && env.APPLE_API_KEY_PATH != ''
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          # Tauri notarizes and staples the .app; the .dmg around it needs its own ticket.
          while IFS= read -r -d '' dmg; do
            result="$(xcrun notarytool submit "${dmg}" \
              --key "${APPLE_API_KEY_PATH}" \
              --key-id "${APPLE_API_KEY}" \
              --issuer "${APPLE_API_ISSUER}" \
              --wait \
              --output-format json)"
            status="$(plutil -extract status raw -o - - <<< "${result}")"
            if [[ "${status}" != "Accepted" ]]; then
              submission="$(plutil -extract id raw -o - - <<< "${result}")"
              xcrun notarytool log "${submission}" \
                --key "${APPLE_API_KEY_PATH}" \
                --key-id "${APPLE_API_KEY}" \
                --issuer "${APPLE_API_ISSUER}" || true
              echo "::error::Notarization of $(basename "${dmg}") finished with status ${status}"
              exit 1
            fi
            xcrun stapler staple "${dmg}"
          done < <(find "src-tauri/target/${RUST_TARGET}/release/bundle/dmg" -name '*.dmg' -print0)

      - name: Verify macOS signatures
        if: matrix.node_platform == 'darwin' && env.GOJS_APPLE_SIGNING_READY == 'true'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle"
          app="$(find "${bundle_dir}/macos" -maxdepth 1 -name '*.app' -print -quit)"
          node_binary="${app}/Contents/Resources/runtime/bin/node"

          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --verify --strict --verbose=2 "${node_binary}"
          if codesign --display --entitlements - --xml "${node_binary}" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::The bundled Node.js binary still requests get-task-allow"
            exit 1
          fi

          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            spctl --assess --type execute --verbose=2 "${app}"
            xcrun stapler validate "${app}"
            while IFS= read -r -d '' dmg; do
              spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}"
              xcrun stapler validate "${dmg}"
            done < <(find "${bundle_dir}/dmg" -name '*.dmg' -print0)
          fi

      - name: Verify Windows signatures
        if: matrix.node_platform == 'win32' && env.GOJS_ARTIFACT_SIGNING_DLIB != ''
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $installers = Get-ChildItem "src-tauri/target/$env:RUST_TARGET/release/bundle" -Recurse -Include *.exe, *.msi
          if (-not $installers) {
            throw "No Windows installers were produced."
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
              throw "$($installer.Name) is not signed and timestamped (status: $($signature.Status))."
            }
            Write-Host "✓ $($installer.Name): $($signature.SignerCertificate.Subject)"
          }

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${GOJS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${GOJS_SIGNING_KEYCHAIN}"
          fi
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "${APPLE_API_KEY_PATH}"
          fi
          # azure/login logs out of Azure in its own post step.

      - name: Stage artifacts and SHA256 checksums
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle"
          mkdir -p release-assets

          # Version-less names keep releases/latest/download/<name> links stable.
          while IFS= read -r -d '' file; do
            case "${file}" in
              *.exe) target="${ASSET_NAME}-setup.exe" ;;
              *) target="${ASSET_NAME}.${file##*.}" ;;
            esac
            if [[ -e "release-assets/${target}" ]]; then
              echo "::error::More than one bundle would be published as ${target}"
              exit 1
            fi
            cp "${file}" "release-assets/${target}"
          done < <(
            find "${bundle_dir}" -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -print0
          )

          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const dir = "release-assets";
            const files = readdirSync(dir).toSorted();
            if (files.length === 0) throw new Error("No desktop artifacts were produced");
            const lines = files.map((name) =>
              `${createHash("sha256").update(readFileSync(`${dir}/${name}`)).digest("hex")}  ${name}`
            );
            writeFileSync(`${dir}/SHA256SUMS-${process.env.ASSET_NAME}.txt`, `${lines.join("\n")}\n`);
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.asset_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - name: Download all successful builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create the single draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for ${RELEASE_TAG}"
            exit 1
          fi

          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "GoJS Desktop ${RELEASE_TAG}"
