name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must match vX.Y.Z exactly (received: ${tag})"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and source versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          node scripts/set-version.mjs --check "${RELEASE_VERSION}"

  build:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            asset_name: GoJS-macOS-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            node_platform: darwin
            node_arch: arm64
          - label: macOS Intel
            asset_name: GoJS-macOS-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            node_platform: darwin
            node_arch: x64
          - label: Windows x64
            asset_name: GoJS-Windows-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            node_platform: win32
            node_arch: x64
          - label: Linux x64
            asset_name: GoJS-Linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            node_platform: linux
            node_arch: x64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - name: Install Linux system dependencies
        if: matrix.node_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source version
        run: pnpm version:check ${{ needs.prepare.outputs.version }}

      - name: Fetch target Node.js runtime
        env:
          NODE_ARCH: ${{ matrix.node_arch }}
          NODE_PLATFORM: ${{ matrix.node_platform }}
        run: pnpm node:fetch

      - name: Configure optional Apple signing
        if: matrix.node_platform == 'darwin'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_SIGNING_IDENTITY_SECRET}" ]]; then
            # Apple Silicon refuses downloaded apps with no signature at all, so
            # sign ad-hoc: users can still allow it in Privacy & Security.
            echo "Apple signing secrets are incomplete; producing ad-hoc signed artifacts."
            echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/gojs-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY_SECRET}" >> "${GITHUB_ENV}"
          echo "GOJS_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          echo "GOJS_APPLE_SIGNING_READY=true" >> "${GITHUB_ENV}"
          rm -f "${certificate_path}"

      - name: Configure optional Apple notarization
        if: matrix.node_platform == 'darwin'
        env:
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${GOJS_APPLE_SIGNING_READY:-}" != "true" || -z "${APPLE_ID_SECRET}" || -z "${APPLE_PASSWORD_SECRET}" || -z "${APPLE_TEAM_ID_SECRET}" ]]; then
            echo "Apple notarization secrets are incomplete; skipping notarization."
            exit 0
          fi

          echo "APPLE_ID=${APPLE_ID_SECRET}" >> "${GITHUB_ENV}"
          echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}" >> "${GITHUB_ENV}"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}" >> "${GITHUB_ENV}"

      - name: Configure optional Windows signing
        if: matrix.node_platform == 'win32'
        shell: pwsh
        env:
          AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          ARTIFACT_SIGNING_CLIENT_VERSION: 1.0.128
          ARTIFACT_SIGNING_CLIENT_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $required = @(
            $env:AZURE_CLIENT_ID_SECRET,
            $env:AZURE_CLIENT_SECRET_SECRET,
            $env:AZURE_TENANT_ID_SECRET,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          if ($missing.Count -gt 0) {
            Write-Host "Artifact Signing secrets are incomplete; keeping unsigned artifacts."
            exit 0
          }

          # The signtool dlib from Microsoft.ArtifactSigning.Client, pinned and verified.
          $version = $env:ARTIFACT_SIGNING_CLIENT_VERSION
          $package = Join-Path $env:RUNNER_TEMP "artifact-signing-client.zip"
          $clientDir = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          Invoke-WebRequest `
            -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" `
            -OutFile $package
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:ARTIFACT_SIGNING_CLIENT_SHA256) {
            throw "Checksum mismatch for Microsoft.ArtifactSigning.Client $version ($hash)."
          }
          Expand-Archive -Force -Path $package -DestinationPath $clientDir

          # Authenticate only with the service principal from the environment.
          $metadataPath = Join-Path $env:RUNNER_TEMP "artifact-signing.json"
          @{
            Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_PROFILE
            ExcludeCredentials = @(
              "ManagedIdentityCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzureCliCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Out-File -FilePath $metadataPath -Encoding utf8

          "AZURE_CLIENT_ID=$env:AZURE_CLIENT_ID_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AZURE_CLIENT_SECRET=$env:AZURE_CLIENT_SECRET_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AZURE_TENANT_ID=$env:AZURE_TENANT_ID_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOJS_ARTIFACT_SIGNING_DLIB=$(Join-Path $clientDir 'bin\x64\Azure.CodeSigning.Dlib.dll')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOJS_ARTIFACT_SIGNING_METADATA=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build desktop bundles
        run: pnpm tauri build --ci --target ${{ matrix.rust_target }} -- --locked

      - name: Notarize macOS disk image
        if: matrix.node_platform == 'darwin' && env.APPLE_ID != ''
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          # Tauri notarizes and staples the .app; the .dmg around it needs its own ticket.
          while IFS= read -r -d '' dmg; do
            result="$(xcrun notarytool submit "${dmg}" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --wait \
              --output-format json)"
            status="$(plutil -extract status raw -o - - <<< "${result}")"
            if [[ "${status}" != "Accepted" ]]; then
              submission="$(plutil -extract id raw -o - - <<< "${result}")"
              xcrun notarytool log "${submission}" \
                --apple-id "${APPLE_ID}" \
                --password "${APPLE_PASSWORD}" \
                --team-id "${APPLE_TEAM_ID}" || true
              echo "::error::Notarization of $(basename "${dmg}") finished with status ${status}"
              exit 1
            fi
            xcrun stapler staple "${dmg}"
          done < <(find "src-tauri/target/${RUST_TARGET}/release/bundle/dmg" -name '*.dmg' -print0)

      - name: Verify macOS signatures
        if: matrix.node_platform == 'darwin' && env.GOJS_APPLE_SIGNING_READY == 'true'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle"
          app="$(find "${bundle_dir}/macos" -maxdepth 1 -name '*.app' -print -quit)"
          node_binary="${app}/Contents/Resources/runtime/bin/node"

          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --verify --strict --verbose=2 "${node_binary}"
          if codesign --display --entitlements - --xml "${node_binary}" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::The bundled Node.js binary still requests get-task-allow"
            exit 1
          fi

          if [[ -n "${APPLE_ID:-}" ]]; then
            spctl --assess --type execute --verbose=2 "${app}"
            xcrun stapler validate "${app}"
            while IFS= read -r -d '' dmg; do
              spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}"
              xcrun stapler validate "${dmg}"
            done < <(find "${bundle_dir}/dmg" -name '*.dmg' -print0)
          fi

      - name: Verify Windows signatures
        if: matrix.node_platform == 'win32' && env.GOJS_ARTIFACT_SIGNING_DLIB != ''
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $installers = Get-ChildItem "src-tauri/target/$env:RUST_TARGET/release/bundle" -Recurse -Include *.exe, *.msi
          if (-not $installers) {
            throw "No Windows installers were produced."
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
              throw "$($installer.Name) is not signed and timestamped (status: $($signature.Status))."
            }
            Write-Host "✓ $($installer.Name): $($signature.SignerCertificate.Subject)"
          }

      - name: Remove temporary Apple keychain
        if: always() && matrix.node_platform == 'darwin'
        run: |
          if [[ -n "${GOJS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${GOJS_SIGNING_KEYCHAIN}"
          fi

      - name: Stage artifacts and SHA256 checksums
        if: success()
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle"
          mkdir -p release-assets

          # Version-less names keep releases/latest/download/<name> links stable.
          while IFS= read -r -d '' file; do
            case "${file}" in
              *.exe) target="${ASSET_NAME}-setup.exe" ;;
              *) target="${ASSET_NAME}.${file##*.}" ;;
            esac
            if [[ -e "release-assets/${target}" ]]; then
              echo "::error::More than one bundle would be published as ${target}"
              exit 1
            fi
            cp "${file}" "release-assets/${target}"
          done < <(
            find "${bundle_dir}" -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -print0
          )

          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const dir = "release-assets";
            const files = readdirSync(dir).toSorted();
            if (files.length === 0) throw new Error("No desktop artifacts were produced");
            const lines = files.map((name) =>
              `${createHash("sha256").update(readFileSync(`${dir}/${name}`)).digest("hex")}  ${name}`
            );
            writeFileSync(`${dir}/SHA256SUMS-${process.env.ASSET_NAME}.txt`, `${lines.join("\n")}\n`);
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rust_target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all successful builds
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create the single draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for ${RELEASE_TAG}"
            exit 1
          fi

          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "GoJS Desktop ${RELEASE_TAG}"
