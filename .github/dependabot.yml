version: 2
updates:
  # Workflows pin every action to a commit SHA; this keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give the community a week to spot a compromised release before we adopt it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope
